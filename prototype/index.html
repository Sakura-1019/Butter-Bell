<!doctype html>
<!--
  PROTOTYPE — Butter Bell 游戏库界面原型（一次性代码，确认风格后丢弃，不要并入正式代码）
  三个方案在同一页面，用 ?variant=A|B|C 切换（底部浮条或键盘 ← →）：
    A 侧栏：ChatGPT 式带文字侧栏，状态用文字标签页筛选，详情抽屉浮在上层
    B 图标栏：窄图标轨道，标签变成横排筛选，详情抽屉把封面墙挤窄
    C 分组：侧栏同 A，“全部”按状态分成几排横向书架
  所有数据都是示例，封面是代码画的全年龄几何图。
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Butter Bell 原型</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ---------- 主题变量：亮色为基准，暗色跟随系统或手动指定 ---------- */
:root {
  color-scheme: light;
  --ground: #ffffff;
  --sidebar-bg: #f7f7f6;
  --surface: #ffffff;
  --raised: #efefec;
  --hover: #ebebe8;
  --active: #e4e4e0;
  --rule: #e6e6e2;
  --control: #d3d3ce;
  --text: #1a1a18;
  --muted: #5e5e59;
  --faint: #6b6b66;
  --primary: #1a1a18;
  --on-primary: #ffffff;
  --accent: #f3d88f;          /* 黄油色：只用在数据标记上（在玩、进度、运行中） */
  --accent-ink: #8a6a10;      /* 亮色下作文字用的深一档 */
  --accent-mark: #e2bb58;     /* 亮色下小圆点用，太淡在白底上看不见 */
  --accent-soft: #fbf3dc;
  --negative: #c4242a;
  --negative-soft: #ffedea;
  --scrim: rgba(20, 20, 18, 0.28);
  --float-shadow: 0 18px 48px rgba(0, 0, 0, 0.14), 0 2px 8px rgba(0, 0, 0, 0.06);
  --cover-edge: rgba(0, 0, 0, 0.06);

  --font: "Inter", "PingFang SC", "Microsoft YaHei UI", "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
  --fs-title: 20px; --fs-section: 15px; --fs-body: 14px; --fs-small: 12px;
  --radius-panel: 16px; --radius-cover: 10px; --radius-control: 999px; --radius-chip: 8px;
  --gap: 16px; --pad: 28px;
  --sidebar: 224px; --rail: 64px; --drawer: 400px; --titlebar: 36px;
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --ground: #212121; --sidebar-bg: #171717; --surface: #2a2a2a; --raised: #303030; --hover: #2a2a2a; --active: #383838;
    --rule: #2f2f2f; --control: #4a4a4a;
    --text: #ececec; --muted: #b4b4b4; --faint: #9b9b9b;
    --primary: #ececec; --on-primary: #212121;
    --accent: #f2d78e; --accent-ink: #f2d78e; --accent-mark: #f2d78e; --accent-soft: #3a3527;
    --negative: #ef6a6e; --negative-soft: #2c1a1b;
    --scrim: rgba(0, 0, 0, 0.5);
    --float-shadow: 0 24px 64px rgba(0, 0, 0, 0.55), 0 2px 8px rgba(0, 0, 0, 0.3);
    --cover-edge: rgba(255, 255, 255, 0.06);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --ground: #212121; --sidebar-bg: #171717; --surface: #2a2a2a; --raised: #303030; --hover: #2a2a2a; --active: #383838;
  --rule: #2f2f2f; --control: #4a4a4a;
  --text: #ececec; --muted: #b4b4b4; --faint: #9b9b9b;
  --primary: #ececec; --on-primary: #212121;
  --accent: #f2d78e; --accent-ink: #f2d78e; --accent-mark: #f2d78e; --accent-soft: #3a3527;
  --negative: #ef6a6e; --negative-soft: #2c1a1b;
  --scrim: rgba(0, 0, 0, 0.5);
  --float-shadow: 0 24px 64px rgba(0, 0, 0, 0.55), 0 2px 8px rgba(0, 0, 0, 0.3);
  --cover-edge: rgba(255, 255, 255, 0.06);
}

/* ---------- 基础 ---------- */
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--ground); color: var(--text);
  font: 400 var(--fs-body)/1.5 var(--font);
  -webkit-font-smoothing: antialiased; overflow: hidden;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
::selection { background: var(--accent); color: #1a1a18; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.num { font-variant-numeric: tabular-nums; }
svg.i { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
* { scrollbar-width: thin; scrollbar-color: var(--control) transparent; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--control); border-radius: 10px; border: 3px solid var(--ground); }
::-webkit-scrollbar-track { background: transparent; }

/* ---------- 窗口 ---------- */
.app { display: grid; grid-template-columns: var(--sidebar) 1fr; height: 100vh; }
.titlebar {
  position: fixed; top: 0; right: 0; height: var(--titlebar); display: flex; z-index: 30;
}
.winbtn { width: 46px; height: var(--titlebar); display: grid; place-items: center; color: var(--muted); }
.winbtn:hover { background: var(--hover); color: var(--text); }
.winbtn.close:hover { background: #c42b1c; color: #fff; }
.winbtn svg.i { width: 14px; height: 14px; stroke-width: 1.3; }

/* ---------- 侧栏 ---------- */
.sidebar {
  background: var(--sidebar-bg); padding: 14px 10px 12px; display: flex; flex-direction: column; gap: 2px;
  overflow-y: auto; min-height: 0;
}
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 10px 18px; font-weight: 600; font-size: 15px; letter-spacing: -0.01em; }
.brand svg { width: 22px; height: 22px; flex: none; }
.nav {
  display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px; border-radius: 10px;
  color: var(--muted); width: 100%; text-align: left; transition: background .15s, color .15s;
}
.nav:hover { background: var(--hover); color: var(--text); }
.nav[aria-current="true"] { background: var(--active); color: var(--text); font-weight: 500; }
.nav .label { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nav .count { font-size: var(--fs-small); color: var(--faint); }
.nav .badge {
  font-size: 11px; font-weight: 600; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px;
  display: grid; place-items: center; background: var(--accent); color: #1a1a18;
}
.group-label { font-size: var(--fs-small); color: var(--faint); padding: 22px 10px 6px; display: flex; justify-content: space-between; }
.group-label button { color: var(--faint); font-size: var(--fs-small); }
.group-label button:hover { color: var(--text); }
.nav.tag { height: 32px; }
.nav.tag .hash { color: var(--faint); width: 16px; text-align: center; }
.sidebar .spacer { flex: 1; }

/* 方案 B：图标轨道 */
.app[data-variant="B"] { grid-template-columns: var(--rail) 1fr; }
.app[data-variant="B"] .sidebar { padding: 14px 10px; align-items: center; }
.app[data-variant="B"] .brand { padding: 4px 0 18px; }
.app[data-variant="B"] .brand span,
.app[data-variant="B"] .nav .label,
.app[data-variant="B"] .nav .count,
.app[data-variant="B"] .tag-section { display: none; }
.app[data-variant="B"] .nav { width: 44px; height: 44px; justify-content: center; padding: 0; position: relative; }
.app[data-variant="B"] .nav .badge { position: absolute; top: 3px; right: 1px; min-width: 18px; height: 18px; font-size: 10px; padding: 0 5px; }
.app[data-variant="B"] .nav svg.i { width: 20px; height: 20px; }

/* ---------- 主区 ---------- */
.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; transition: padding-right .38s var(--ease-out); }
.app[data-variant="B"].drawer-open .main { padding-right: calc(var(--drawer) + 16px); }
.toolbar {
  display: flex; align-items: center; gap: 12px; padding: 22px var(--pad) 0; padding-top: calc(var(--titlebar) + 4px); flex-wrap: wrap;
}
.toolbar h1 { font-size: var(--fs-title); font-weight: 600; letter-spacing: -0.01em; margin: 0; white-space: nowrap; }
.toolbar h1 .count { color: var(--faint); font-weight: 400; margin-left: 8px; }
.toolbar .spacer { flex: 1; }
.search {
  display: flex; align-items: center; gap: 8px; height: 34px; width: 240px; padding: 0 12px;
  border-radius: var(--radius-control); background: var(--raised); color: var(--faint);
  transition: background .15s, box-shadow .15s;
}
.search:focus-within { background: var(--surface); box-shadow: 0 0 0 1px var(--control); }
.search input { border: 0; outline: 0; background: transparent; flex: 1; min-width: 0; color: var(--text); font-size: 13px; }
.search input::placeholder { color: var(--faint); }
.seg { display: inline-flex; background: var(--raised); border-radius: var(--radius-control); padding: 3px; gap: 2px; }
.seg button {
  height: 28px; padding: 0 12px; border-radius: var(--radius-control); color: var(--muted); font-size: 13px;
  display: inline-flex; align-items: center; gap: 6px; transition: background .15s, color .15s;
}
.seg button.icon { width: 34px; padding: 0; justify-content: center; }
.seg button:hover { color: var(--text); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.btn {
  height: 34px; padding: 0 14px; border-radius: var(--radius-control); display: inline-flex; align-items: center; gap: 7px;
  font-size: 13px; font-weight: 500; color: var(--text); background: var(--raised); white-space: nowrap;
  transition: background .15s, transform .1s, opacity .15s;
}
.btn:hover { background: var(--active); }
.btn:active { transform: scale(0.97); }
.btn.primary { background: var(--primary); color: var(--on-primary); }
.btn.primary:hover { opacity: .88; }
.btn.ghost { background: transparent; color: var(--muted); }
.btn.ghost:hover { background: var(--hover); color: var(--text); }
.btn.danger { background: transparent; color: var(--negative); }
.btn.danger:hover { background: var(--negative-soft); }
.btn.danger.solid { background: var(--negative); color: #fff; }
.btn[disabled] { opacity: .4; pointer-events: none; }
.btn.on { background: var(--accent-soft); color: var(--accent-ink); }

.subbar { display: flex; align-items: center; gap: 4px; padding: 16px var(--pad) 0; flex-wrap: wrap; }
.tab {
  height: 30px; padding: 0 12px; border-radius: var(--radius-control); color: var(--muted); font-size: 13px;
  display: inline-flex; align-items: center; gap: 6px; transition: background .15s, color .15s;
}
.tab:hover { color: var(--text); background: var(--hover); }
.tab[aria-pressed="true"] { color: var(--text); background: var(--active); font-weight: 500; }
.tab .n { color: var(--faint); font-weight: 400; }

.content { flex: 1; overflow-y: auto; padding: 20px var(--pad) 120px; min-height: 0; }

/* ---------- 封面墙 ---------- */
.wall { display: grid; grid-template-columns: repeat(auto-fill, minmax(196px, 1fr)); gap: 26px 18px; }
.card { text-align: left; display: flex; flex-direction: column; gap: 10px; min-width: 0; border-radius: 12px; }
.cover {
  position: relative; aspect-ratio: 4 / 3; border-radius: var(--radius-cover); overflow: hidden; background: var(--raised);
  box-shadow: inset 0 0 0 1px var(--cover-edge);
  transition: transform .35s var(--ease-out), box-shadow .35s var(--ease-out);
}
.cover img { width: 100%; height: 100%; object-fit: cover; display: block; transition: filter .35s var(--ease-out), transform .35s var(--ease-out); }
.card:hover .cover { transform: translateY(-3px); box-shadow: 0 12px 28px rgba(0,0,0,.28); }
.card[aria-current="true"] .cover { box-shadow: 0 0 0 2px var(--text); }
.privacy .cover img { filter: blur(22px) saturate(0.7); transform: scale(1.25); }
.cover .flag {
  position: absolute; left: 8px; bottom: 8px; height: 22px; padding: 0 8px; border-radius: 11px; font-size: 11px; font-weight: 500;
  background: rgba(18,18,17,.78); color: #f4f4f2; display: inline-flex; align-items: center; gap: 6px;
}
.flag .dot, .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent-mark); flex: none; }
.cover.empty { display: grid; place-items: center; color: var(--faint); font-size: 12px; text-align: center; }
.cover.empty svg.i { width: 22px; height: 22px; margin: 0 auto 6px; display: block; }
.card.gone .cover img { filter: grayscale(1) brightness(.6); }
.privacy .card.gone .cover img { filter: grayscale(1) brightness(.6) blur(22px); }
.card .name { font-size: 13.5px; font-weight: 500; line-height: 1.35; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .meta { font-size: var(--fs-small); color: var(--faint); margin-top: 2px; display: flex; align-items: center; gap: 6px; white-space: nowrap; overflow: hidden; }
.card .meta .run { color: var(--accent-ink); }

/* 方案 C：书架 */
.shelf + .shelf { margin-top: 36px; }
.shelf h2 { font-size: var(--fs-section); font-weight: 600; margin: 0 0 14px; display: flex; align-items: baseline; gap: 8px; }
.shelf h2 .n { color: var(--faint); font-weight: 400; font-size: 13px; }
.shelf .row { display: grid; grid-auto-flow: column; grid-auto-columns: 232px; gap: 18px; overflow-x: auto; padding: 4px 4px 12px; margin: -4px -4px 0; scroll-snap-type: x proximity; scrollbar-width: none; }
.shelf .row::-webkit-scrollbar { display: none; }
.shelf .row .card { scroll-snap-align: start; }

/* ---------- 列表 ---------- */
table.list { width: 100%; border-collapse: collapse; }
.list th { font-size: var(--fs-small); font-weight: 400; color: var(--faint); text-align: left; padding: 0 12px 10px; border-bottom: 1px solid var(--rule); }
.list td { padding: 10px 12px; border-bottom: 1px solid var(--rule); vertical-align: middle; }
.list th.num, .list td.num { text-align: right; }
.list tr.row { cursor: pointer; transition: background .12s; }
.list tr.row:hover td { background: var(--hover); }
.list tr.row[aria-current="true"] td { background: var(--active); }
.list .thumb { width: 64px; aspect-ratio: 4/3; border-radius: 6px; overflow: hidden; background: var(--raised); flex: none; position: relative; }
.list .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; transition: filter .3s; }
.privacy .list .thumb img { filter: blur(10px); transform: scale(1.3); }
.list .namecell { display: flex; align-items: center; gap: 14px; min-width: 0; }
.list .nm { font-weight: 500; }
.list .mk { font-size: var(--fs-small); color: var(--faint); }
.list .muted { color: var(--muted); }
.list tr.gone .nm { color: var(--muted); }
.list tr.gone .thumb img { filter: grayscale(1) brightness(.6); }
.pill {
  display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 9px; border-radius: 11px; font-size: 12px;
  background: var(--raised); color: var(--muted); white-space: nowrap;
}
.pill.playing { background: var(--accent-soft); color: var(--accent-ink); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { height: 22px; padding: 0 8px; border-radius: 6px; font-size: 12px; background: var(--raised); color: var(--muted); display: inline-flex; align-items: center; }

/* 方案 B：标签横排 */
.tagbar { display: none; }
.app[data-variant="B"] .tagbar { display: flex; gap: 6px; padding: 12px var(--pad) 0; flex-wrap: wrap; }
.tagbar button { height: 28px; padding: 0 11px; border-radius: var(--radius-control); font-size: 12.5px; color: var(--muted); box-shadow: inset 0 0 0 1px var(--rule); transition: background .15s, color .15s; }
.tagbar button:hover { color: var(--text); background: var(--hover); }
.tagbar button[aria-pressed="true"] { background: var(--primary); color: var(--on-primary); box-shadow: none; }

/* ---------- 空状态 ---------- */
.empty-state { padding: 64px 0; text-align: center; color: var(--muted); }
.empty-state p { margin: 0 0 14px; }

/* ---------- 详情抽屉 ---------- */
.scrim { position: fixed; inset: 0; background: transparent; z-index: 40; display: none; }
.drawer-open .scrim { display: block; }
.app[data-variant="B"] .scrim { display: none !important; }
.drawer {
  position: fixed; top: var(--titlebar); right: 8px; bottom: 8px; width: var(--drawer); z-index: 50;
  background: var(--surface); border-radius: 18px; box-shadow: var(--float-shadow);
  transform: translateX(calc(100% + 24px)); transition: transform .42s var(--ease-out), visibility .42s;
  display: flex; flex-direction: column; overflow: hidden; visibility: hidden;
}
.drawer-open .drawer { transform: none; visibility: visible; }
.drawer .scroll { flex: 1; overflow-y: auto; padding: 16px 20px 24px; }
.drawer .top { display: flex; justify-content: flex-end; padding: 10px 10px 0; position: absolute; right: 0; top: 0; z-index: 2; }
.iconbtn { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); transition: background .15s, color .15s; }
.iconbtn:hover { background: var(--hover); color: var(--text); }
.drawer .top .iconbtn { background: rgba(18,18,17,.55); color: #fff; }
.drawer .top .iconbtn:hover { background: rgba(18,18,17,.8); }
.d-cover { aspect-ratio: 4/3; border-radius: 12px; overflow: hidden; background: var(--raised); margin: 0 -8px; position: relative; box-shadow: inset 0 0 0 1px var(--cover-edge); }
.d-cover img { width: 100%; height: 100%; object-fit: cover; display: block; transition: filter .35s var(--ease-out), transform .35s var(--ease-out); }
.privacy .d-cover img { filter: blur(26px) saturate(.7); transform: scale(1.25); }
.d-cover.gone img { filter: grayscale(1) brightness(.6); }
.d-head { padding: 18px 0 0; }
.d-head h2 { font-size: 20px; font-weight: 600; letter-spacing: -0.01em; margin: 0; line-height: 1.3; }
.d-head .maker { color: var(--muted); font-size: 13px; margin-top: 4px; }
.d-launch { display: flex; gap: 8px; margin-top: 18px; }
.d-launch .btn.primary { flex: 1; height: 42px; font-size: 14px; justify-content: center; }
.d-launch .btn.primary.running { background: var(--accent); color: #1a1a18; }
.d-stats { display: grid; grid-template-columns: repeat(3, 1fr); margin-top: 20px; padding: 14px 0; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
.d-stats div + div { padding-left: 14px; border-left: 1px solid var(--rule); }
.d-stats .k { font-size: var(--fs-small); color: var(--faint); }
.d-stats .v { font-size: 15px; font-weight: 500; margin-top: 2px; white-space: nowrap; }
.d-sec { margin-top: 22px; }
.d-sec h3 { font-size: 13px; font-weight: 500; color: var(--muted); margin: 0 0 10px; }
.d-sec .seg { display: flex; }
.d-sec .seg button { flex: 1; justify-content: center; }
.tagedit { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.tagedit .chip { height: 28px; padding: 0 6px 0 10px; font-size: 12.5px; gap: 4px; color: var(--text); }
.tagedit .chip button { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; color: var(--faint); }
.tagedit .chip button:hover { background: var(--active); color: var(--text); }
.tagedit .chip svg.i { width: 12px; height: 12px; }
.tagedit .add { height: 28px; padding: 0 10px; border-radius: 6px; font-size: 12.5px; color: var(--faint); box-shadow: inset 0 0 0 1px var(--rule); display: inline-flex; align-items: center; gap: 4px; }
.tagedit .add:hover { color: var(--text); }
.tagedit .add svg.i { width: 13px; height: 13px; }
.tagedit input { height: 28px; width: 110px; padding: 0 10px; border-radius: 6px; border: 0; outline: 0; background: var(--raised); font-size: 12.5px; }
.rowline { display: flex; align-items: center; gap: 12px; min-height: 44px; }
.rowline + .rowline { border-top: 1px solid var(--rule); }
.rowline .lbl { flex: 1; min-width: 0; }
.rowline .lbl small { display: block; color: var(--faint); font-size: var(--fs-small); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.switch { width: 38px; height: 22px; border-radius: 11px; background: var(--control); position: relative; transition: background .2s; flex: none; }
.switch::after { content: ""; position: absolute; left: 3px; top: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .25s var(--ease-out); box-shadow: 0 1px 2px rgba(0,0,0,.25); }
.switch[aria-checked="true"] { background: var(--text); }
.switch[aria-checked="true"]::after { transform: translateX(16px); background: var(--surface); }
.linkbtn { color: var(--muted); font-size: 13px; padding: 4px 8px; border-radius: 6px; }
.linkbtn:hover { background: var(--hover); color: var(--text); }
.note { border-radius: 12px; background: var(--raised); padding: 12px 14px; font-size: 13px; color: var(--muted); margin-top: 16px; }
.note strong { color: var(--text); font-weight: 500; display: block; margin-bottom: 2px; }
.note .acts { display: flex; gap: 8px; margin-top: 10px; }
.confirm { border-radius: 12px; background: var(--negative-soft); padding: 12px 14px; font-size: 13px; margin-top: 10px; }
.confirm p { margin: 0 0 10px; color: var(--text); }
.confirm .acts { display: flex; gap: 8px; justify-content: flex-end; }
.d-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 24px; }

/* ---------- 待解压收件箱 ---------- */

@keyframes fade { from { opacity: 0; } }

const S = {
  variant: 'C', theme: 'system', nav: 'all', tag: null, status: '全部', view: 'grid', query: '',
  privacy: false, openId: null, running: null, setDecision: null, afterPref: null,
  selected: new Set(), expanded: new Set(), progress: {}, failed: {}, confirmUninstall: false, addingTag: false,
};
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* ================= 格式化 ================= */
function fmtTime(min) {
  if (!min) return '未玩过';
  if (min < 60) return `${min} 分钟`;
  return `${(min / 60).toFixed(1)} 小时`;
}
function fmtLast(t) {
  if (!t) return '—';
  const days = Math.floor((new Date(NOW.toDateString()) - new Date(t.toDateString())) / 864e5);
  const hm = t.toTimeString().slice(0, 5);
  if (days === 0) return `今天 ${hm}`;
  if (days === 1) return `昨天 ${hm}`;
  if (days < 7) return `${days} 天前`;
  return `${t.getMonth() + 1}月${t.getDate()}日`;
}
const fmtGB = (n) => n >= 1 ? `${n.toFixed(2)} GB` : `${Math.round(n * 1024)} MB`;

/* ================= 选择器 ================= */
function allTags() {
  const m = new Map();
  GAMES.forEach(g => g.tags.forEach(t => m.set(t, (m.get(t) || 0) + 1)));
  return [...m.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
}
const statusOf = (g) => g.gone ? '已卸载' : g.status;
function baseList() {
  let list = GAMES.slice();
  if (S.nav === 'recent') list = list.filter(g => g.last).sort((a, b) => b.last - a.last).slice(0, 10);
  else list.sort((a, b) => (a.gone - b.gone) || ((b.last || 0) - (a.last || 0)) || b.id - a.id);
  if (S.tag) list = list.filter(g => g.tags.includes(S.tag));
  if (S.query) { const q = S.query.toLowerCase(); list = list.filter(g => (g.name + g.maker + g.folder).toLowerCase().includes(q)); }
  return list;
}
function visibleGames() {
  const list = baseList();
  if (S.nav === 'all' && S.status !== '全部' && S.variant !== 'C') return list.filter(g => statusOf(g) === S.status);
  return list;
}
function inboxRows() {
  // 疑似同套：未决定时放在提示框里；合并后变一项；否认后各自独立
  const rows = [];
  let setDone = false;
  for (const it of INBOX) {
    if (it.set) {
      if (S.setDecision === 'split') rows.push(it);
      else if (!setDone) {
        setDone = true;
        const members = INBOX.filter(x => x.set === it.set);
        rows.push({ id: 'set-' + it.set, isSet: true, merged: S.setDecision === 'merge', members, name: '蒼の旅団', ext: 'RAR',
          gb: members.reduce((s, m) => s + m.gb, 0), pw: 'saved', added: it.added });
      }
    } else rows.push(it);
  }
  return rows;
}
function selectableIds() {
  return inboxRows().flatMap(r => r.isSet && !r.merged ? r.members.map(m => m.id) : [r.id]);
}

/* ================= 渲染 ================= */
function renderSidebar() {

  const inboxN = selectableIds().length;
  const tags = allTags().map(([t, n]) =>
    `<button class="nav tag" data-action="tag" data-tag="${esc(t)}" aria-current="${S.tag === t}"><span class="hash">#</span><span class="label">${esc(t)}</span><span class="count num">${n}</span></button>`).join('');
  $('#sidebar').innerHTML = `
    <div class="brand">${BELL}<span>Butter Bell</span></div>
    ${nav('all', 'games', '全部游戏', `<span class="count num">${GAMES.length}</span>`)}
    ${nav('inbox', 'inbox', '待解压', inboxN ? `<span class="badge num" aria-label="${inboxN} 个待解压">${inboxN}</span>` : '')}
    ${nav('recent', 'clock', '最近游玩')}
    <div class="tag-section">
      <div class="group-label"><span>标签</span>${S.tag ? '<button data-action="tag" data-tag="">清除</button>' : ''}</div>
      ${tags}

    <button class="nav" data-action="toast" data-msg="设置页不在这次原型的范围里" title="设置">${ic('settings')}<span class="label">设置</span></button>`;
}

function renderToolbar() {

  if (S.nav !== 'inbox' && S.tag) title = `# ${S.tag}`;

    <div class="seg" role="group" aria-label="视图">
      <button class="icon" data-action="view" data-view="grid" aria-pressed="${S.view === 'grid'}" title="封面墙">${ic('grid')}</button>

    </div>` : ''}

function renderSubbar() {
  // 方案 B 的标签横排
  $('#tagbar').innerHTML = S.nav === 'inbox' ? '' :
    `<button data-action="tag" data-tag="" aria-pressed="${!S.tag}">全部标签</button>` +

  const sub = $('#subbar');
  if (S.nav !== 'all' || S.variant === 'C') { sub.innerHTML = ''; sub.style.display = 'none'; return; }
  sub.style.display = '';
  const base = baseList();
  const n = (s) => s === '全部' ? base.length : base.filter(g => statusOf(g) === s).length;
  sub.innerHTML = ['全部', ...STATUSES, '已卸载'].map(s =>
    `<button class="tab" data-action="status" data-status="${s}" aria-pressed="${S.status === s}">${s}<span class="n num">${n(s)}</span></button>`).join('');

function coverHTML(g, cls = 'cover') {
  if (!g.cover) return `<div class="${cls} empty"><div>${ic('image')}待补封面</div></div>`;
  const running = S.running && S.running.id === g.id;
  const flag = running ? `<span class="flag"><span class="dot"></span>运行中</span>` : g.gone ? `<span class="flag">已卸载</span>` : '';
  return `<div class="${cls}"><img src="${g.cover}" alt="" loading="lazy">${flag}</div>`;
}
function cardHTML(g) {
  const running = S.running && S.running.id === g.id;
  let meta;
  if (running) meta = `<span class="dot"></span><span class="run">运行中</span>`;
  else if (S.nav === 'recent') meta = `${fmtLast(g.last)} · ${fmtTime(g.min)}`;
  else if (g.needsInfo) meta = `还没有封面和名称`;
  else meta = `${g.status === '在玩' && !g.gone ? '<span class="dot"></span>' : ''}${esc(g.maker)} · ${g.min ? fmtTime(g.min) : g.status}`;
  return `<button class="card${g.gone ? ' gone' : ''}" data-action="open" data-id="${g.id}" aria-current="${S.openId === g.id}">
    ${coverHTML(g)}<div><div class="name">${esc(g.name)}</div><div class="meta num">${meta}</div></div></button>`;
}
function listHTML(list) {
  return `<table class="list"><thead><tr><th>名称</th><th>状态</th><th>标签</th><th class="num">时长</th><th class="num">上次游玩</th></tr></thead><tbody>${
    list.map(g => {
      const st = statusOf(g), running = S.running && S.running.id === g.id;
      const pill = running ? `<span class="pill playing"><span class="dot"></span>运行中</span>` : `<span class="pill${st === '在玩' ? ' playing' : ''}">${st}</span>`;
      return `<tr class="row${g.gone ? ' gone' : ''}" data-action="open" data-id="${g.id}" aria-current="${S.openId === g.id}" tabindex="0">
        <td><div class="namecell"><div class="thumb">${g.cover ? `<img src="${g.cover}" alt="" loading="lazy">` : ''}</div><div><div class="nm">${esc(g.name)}</div><div class="mk">${esc(g.maker)}</div></div></div></td>
        <td>${pill}</td><td><div class="chips">${g.tags.map(t => `<span class="chip">${esc(t)}</span>`).join('')}</div></td>
        <td class="num muted">${g.min ? fmtTime(g.min) : '—'}</td><td class="num muted">${fmtLast(g.last)}</td></tr>`;
    }).join('')}</tbody></table>`;
}
function emptyHTML() {
  if (S.query) return `<div class="empty-state"><p>没有找到“${esc(S.query)}”</p><button class="btn" data-action="clear-query">清除搜索</button></div>`;
  if (S.nav === 'recent') return `<div class="empty-state"><p>还没有从 Butter Bell 启动过游戏</p></div>`;
  return `<div class="empty-state"><p>这个筛选下没有游戏</p><button class="btn" data-action="reset-filters">显示全部</button></div>`;
}

function renderContent() {
  const app = $('#app');
  app.classList.toggle('privacy', S.privacy);
  document.body.classList.toggle('privacy', S.privacy);
  if (S.nav === 'inbox') return renderInbox();
  const list = visibleGames();
  $('#title-count').textContent = list.length;
  renderSubbar();
  const el = $('#content');
  if (!list.length) { el.innerHTML = emptyHTML(); return; }
  if (S.view === 'list') { el.innerHTML = listHTML(list); return; }
  if (S.variant === 'C' && S.nav === 'all') {
    const groups = ['在玩', '想玩', '通关', '已卸载'].map(s => [s, list.filter(g => statusOf(g) === s)]).filter(([, l]) => l.length);
    el.innerHTML = groups.map(([s, l]) =>
      `<section class="shelf"><h2>${s}<span class="n num">${l.length}</span></h2><div class="row">${l.map(cardHTML).join('')}</div></section>`).join('');
    return;
  }
  el.innerHTML = `<div class="wall">${list.map(cardHTML).join('')}</div>`;
}

function archHTML(r, opts = {}) {
  const prog = S.progress[r.id], err = S.failed[r.id];
  const sel = S.selected.has(r.id);
  const parts = r.parts ? r.parts.length : 0;
  const pw = { none: '', saved: `<span class="sep">·</span><span class="ok">${ic('key')} 已存密码</span>`, unknown: `<span class="sep">·</span><span class="warn">${ic('lock')} 需要密码</span>` }[r.pw];
  const meta = [
    `<span>${r.ext}</span>`,
    parts ? `<span class="sep">·</span><button class="expand" data-action="expand" data-id="${r.id}" aria-expanded="${S.expanded.has(r.id)}">已合并 ${parts} 个分卷${ic('chevDown')}</button>` : '',
    r.isSet && r.merged ? `<span class="sep">·</span><button class="expand" data-action="expand" data-id="${r.id}" aria-expanded="${S.expanded.has(r.id)}">${r.members.length} 个包合为一项${ic('chevDown')}</button>` : '',
    `<span class="sep">·</span><span class="num">${fmtGB(r.gb)}</span>`,
    pw,
    r.rj ? `<span class="sep">·</span><span class="ok">识别到 ${r.rj}</span>` : '',
  ].join('');
  const sub = S.expanded.has(r.id) ? `<ul class="parts">${(r.parts || (r.members || []).map(m => m.name + '.rar')).map(p => `<li>${esc(p)}</li>`).join('')}</ul>` : '';
  let side = `<div class="side">${r.added}</div>`;
  let extra = '';
  if (prog != null) side = `<div class="side num">${prog < 100 ? `正在解压 ${Math.floor(prog)}%` : '完成'}<div class="progress"><div style="width:${prog}%"></div></div></div>`;
  if (err) {
    side = `<div class="side" style="color:var(--negative)">没解开</div>`;
    extra = `<div class="mt"><span class="warn">常用密码都试过了，都不对。</span></div><div class="pwrow"><input type="password" placeholder="输入解压密码" id="pw-${r.id}" aria-label="解压密码"><button class="btn primary" data-action="retry" data-id="${r.id}">解压</button></div>`;
  }
  const disabled = prog != null;
  return `<div class="arch${err ? ' err' : ''}" data-id="${r.id}">
    <button class="check" role="checkbox" aria-checked="${sel}" data-action="select" data-id="${r.id}" aria-label="选择 ${esc(r.name)}" ${disabled ? 'disabled' : ''}>${ic('check')}</button>
    <div class="ic">${ic(r.isSet && r.merged ? 'layers' : 'archive')}</div>
    <div class="body"><div class="fn">${esc(r.name)}${opts.noExt || r.isSet ? '' : '.' + r.ext.toLowerCase()}</div><div class="mt">${meta}</div>${sub}${extra}</div>
    ${side}</div>`;
}

        <div><div class="k">游戏时长</div><div class="v num">${fmtTime(g.min)}</div></div>
        <div><div class="k">上次游玩</div><div class="v num">${fmtLast(g.last)}</div></div>
        <div><div class="k">加入</div><div class="v num">${g.added.slice(5).replace('-', '月')}日</div></div>
      </div>
      <div class="d-sec"><h3>状态</h3><div class="seg" role="radiogroup" aria-label="状态">${STATUSES.map(s =>
        `<button role="radio" data-action="set-status" data-s="${s}" aria-pressed="${g.status === s}" aria-checked="${g.status === s}">${s}</button>`).join('')}</div></div>
      <div class="d-sec"><h3>标签</h3><div class="tagedit">${g.tags.map(t =>
        `<span class="chip">${esc(t)}<button data-action="rm-tag" data-tag="${esc(t)}" aria-label="移除标签 ${esc(t)}">${ic('x')}</button></span>`).join('')}
        ${S.addingTag ? `<input id="newtag" placeholder="标签名，回车添加" aria-label="新标签">` : `<button class="add" data-action="add-tag">${ic('plus')}添加</button>`}</div></div>
      <div class="d-sec"><h3>启动</h3>
        <div class="rowline"><div class="lbl">启动文件<small>${esc(g.exe)}</small></div><button class="linkbtn" data-action="toast" data-msg="文件夹里有多个 exe 时会列出来让你选，选完记住">更改</button></div>
        <div class="rowline"><div class="lbl">用 Locale Emulator 启动<small>日文游戏乱码或打不开时打开</small></div><button class="switch" role="switch" aria-checked="${g.le}" data-action="le" aria-label="用 Locale Emulator 启动"></button></div>
      </div>
      ${foot}
    </div>`;
  const nt = $('#newtag');
  if (nt) {
    nt.focus();
    nt.addEventListener('keydown', e => {
      if (e.key === 'Enter' && nt.value.trim()) { const t = nt.value.trim(); if (!g.tags.includes(t)) g.tags.push(t); S.addingTag = false; renderAll(); }
      if (e.key === 'Escape') { e.stopPropagation(); S.addingTag = false; renderDrawer(); }
    });
    nt.addEventListener('blur', () => { setTimeout(() => { if (S.addingTag) { S.addingTag = false; renderDrawer(); } }, 120); });
  }
}

function renderProto() {
  const names = { A: '侧栏', B: '图标栏', C: '按状态分组' };
  const themes = { system: '跟随系统', dark: '暗色', light: '亮色' };
  $('#proto').innerHTML = `
    <button data-action="variant" data-d="-1" aria-label="上一个方案">${ic('chevL')}</button>
    <span class="lbl">方案 ${S.variant} · ${names[S.variant]}</span>
    <button data-action="variant" data-d="1" aria-label="下一个方案">${ic('chevR')}</button>
    <span class="div"></span>
    <button data-action="theme" title="原型用：切换主题预览">${ic('sun')}${themes[S.theme]}</button>`;
}

function renderAll() {
  $('#app').dataset.variant = S.variant;
  renderSidebar(); renderToolbar(); renderContent(); renderDrawer(); renderProto();
}

/* ================= 交互 ================= */
function toast(msg) {
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  $('#toasts').appendChild(t);
  setTimeout(() => t.remove(), 3600);
}
function setVariant(v) {
  S.variant = v;
  const u = new URL(location.href); u.searchParams.set('variant', v); history.replaceState(null, '', u);
  renderAll();
}
function openModal() {
  const opts = [
    ['keep', '保留压缩包', '原样留在 G:\\butter_compressed'],
    ['recycle', '移到回收站', '需要时还能从回收站找回'],
    ['move', '挪进“已解压”文件夹', 'G:\\butter_compressed\\已解压'],
  ];
  let choice = 'move';
  const m = $('#modal');
  const draw = () => {
    m.innerHTML = `<div class="modal">
      <h2 id="modal-title">解压完以后，压缩包怎么处理？</h2>
      <p>只问这一次，以后可以在设置里改。</p>
      <div role="radiogroup">${opts.map(([k, b, s]) => `<button class="opt" role="radio" aria-checked="${choice === k}" data-k="${k}"><span class="radio"></span><span><b>${b}</b><small>${s}</small></span></button>`).join('')}</div>
      <div class="foot"><label><button class="check" role="checkbox" aria-checked="true" id="remember">${ic('check')}</button>记住我的选择</label>
      <button class="btn ghost" data-m="cancel">取消</button><button class="btn primary" data-m="go">开始解压</button></div></div>`;
  };
  draw();
  m.classList.add('show');
  m.onclick = (e) => {
    const o = e.target.closest('.opt');
    if (o) { choice = o.dataset.k; draw(); m.querySelector(`.opt[data-k="${choice}"]`).focus(); return; }
    const r = e.target.closest('#remember');
    if (r) { r.setAttribute('aria-checked', r.getAttribute('aria-checked') === 'true' ? 'false' : 'true'); return; }
    const b = e.target.closest('[data-m]');
    if (e.target === m || (b && b.dataset.m === 'cancel')) { m.classList.remove('show'); return; }
    if (b && b.dataset.m === 'go') {
      const remember = $('#remember').getAttribute('aria-checked') === 'true';
      if (remember) S.afterPref = choice;
      m.classList.remove('show');
      runExtract(choice);
    }
  };
  setTimeout(() => m.querySelector('.opt[aria-checked="true"]').focus(), 30);
}
function runExtract(choice) {
  const ids = [...S.selected].filter(id => selectableIds().includes(id));
  S.selected.clear();
  ids.forEach((id, i) => { S.progress[id] = 0; S.progress[id + ':delay'] = i * 6; });
  const timer = setInterval(() => {
    let done = true;
    ids.forEach(id => {
      if (S.progress[id + ':delay'] > 0) { S.progress[id + ':delay']--; done = false; return; }
      if (S.progress[id] < 100) { S.progress[id] = Math.min(100, S.progress[id] + 4 + Math.random() * 6); done = false; }
    });
    if (S.nav === 'inbox') renderInbox();
    if (done) { clearInterval(timer); setTimeout(() => finishExtract(ids, choice), 350); }
  }, 70);
  if (S.nav === 'inbox') renderInbox();
}
function finishExtract(ids, choice) {
  const added = [], failed = [];
  ids.forEach(id => {
    delete S.progress[id]; delete S.progress[id + ':delay'];
    let item = INBOX.find(x => x.id === id);
    const setRow = id.startsWith('set-') ? inboxRows().find(r => r.id === id) : null;
    if (item && item.pw === 'unknown') { failed.push(id); S.failed[id] = true; return; }
    if (setRow) { INBOX = INBOX.filter(x => !setRow.members.includes(x)); item = setRow; }
    else INBOX = INBOX.filter(x => x.id !== id);
    const nice = item.rj ? item.name.replace(/^RJ\d+_/, '') : item.name;
    const g = { id: Date.now() + Math.random(), name: nice, maker: '', status: '想玩', tags: [], min: 0, last: null,
      added: '2026-11-03', exe: 'Game.exe', le: false, folder: item.name, cover: null, needsInfo: true };
    if (item.rj) { g.cover = coverSVG(Math.floor(Math.random() * 90)); g.maker = '幽霊工房'; g.needsInfo = false; }
    GAMES.unshift(g); added.push(g);
  });
  const how = { keep: '压缩包已保留', recycle: '压缩包已移到回收站', move: '压缩包已挪进“已解压”' }[choice];
  if (added.length) {
    const need = added.filter(g => g.needsInfo).length;
    toast(`${added.length} 个游戏已加入游戏库，${how}。${need ? `其中 ${need} 个还要补封面和名称。` : ''}`);
  }
  if (failed.length) toast('有 1 个包没解开：需要输入密码');
  renderAll();
}

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const a = el.dataset.action;
  if (a === 'nav') { S.nav = el.dataset.nav; S.tag = null; S.status = '全部'; S.query = ''; if (S.nav === 'inbox') S.openId = null; renderAll(); $('#content').scrollTop = 0; }
  else if (a === 'tag') { S.tag = el.dataset.tag && S.tag !== el.dataset.tag ? el.dataset.tag : null; if (S.nav === 'inbox') S.nav = 'all'; S.status = '全部'; renderAll(); }
  else if (a === 'status') { S.status = el.dataset.status; renderContent(); }
  else if (a === 'view') { S.view = el.dataset.view; renderToolbar(); renderContent(); }
  else if (a === 'privacy') { S.privacy = !S.privacy; renderToolbar(); renderContent(); }
  else if (a === 'open') { const id = Number(el.dataset.id) || parseFloat(el.dataset.id); S.openId = S.openId === id && S.variant !== 'B' ? id : id; S.confirmUninstall = false; S.addingTag = false; renderDrawer(); renderContent(); }
  else if (a === 'close-drawer') { S.openId = null; renderDrawer(); renderContent(); }
  else if (a === 'launch') {
    const g = GAMES.find(x => x.id === S.openId);
    if (S.running && S.running.id === g.id) {
      const sec = Math.floor((Date.now() - S.running.start) / 1000);
      g.min += Math.max(1, Math.round(sec / 60)); g.last = new Date(); clearInterval(S.running.timer); S.running = null;
      toast(`已结束。这次记了 ${Math.max(1, Math.round(sec / 60))} 分钟（原型里按真实秒数折算）`);
    } else {
      if (S.running) { clearInterval(S.running.timer); }
      S.running = { id: g.id, start: Date.now(), timer: setInterval(() => renderDrawer(), 1000) };
      if (g.status === '想玩') g.status = '在玩';
      toast(`正在启动 ${g.exe}${g.le ? '（通过 Locale Emulator）' : ''}`);
    }
    renderDrawer(); renderContent();
  }
  else if (a === 'set-status') { GAMES.find(x => x.id === S.openId).status = el.dataset.s; renderDrawer(); renderContent(); }
  else if (a === 'rm-tag') { const g = GAMES.find(x => x.id === S.openId); g.tags = g.tags.filter(t => t !== el.dataset.tag); if (S.tag && !GAMES.some(x => x.tags.includes(S.tag))) S.tag = null; renderAll(); }
  else if (a === 'add-tag') { S.addingTag = true; renderDrawer(); }
  else if (a === 'le') { const g = GAMES.find(x => x.id === S.openId); g.le = !g.le; renderDrawer(); }
  else if (a === 'uninstall-ask') { S.confirmUninstall = true; renderDrawer(); }
  else if (a === 'uninstall-cancel') { S.confirmUninstall = false; renderDrawer(); }
  else if (a === 'uninstall') { const g = GAMES.find(x => x.id === S.openId); g.gone = true; S.confirmUninstall = false; if (S.running && S.running.id === g.id) { clearInterval(S.running.timer); S.running = null; } toast(`“${g.name}”的游戏文件夹已移到回收站，记录保留`); renderDrawer(); renderContent(); }
  else if (a === 'purge') { const g = GAMES.find(x => x.id === S.openId); GAMES = GAMES.filter(x => x !== g); S.openId = null; toast(`已彻底移除“${g.name}”的记录`); renderAll(); }
  else if (a === 'select') { const id = el.dataset.id; S.selected.has(id) ? S.selected.delete(id) : S.selected.add(id); renderInbox(); }
  else if (a === 'select-all') { const ids = selectableIds().filter(id => S.progress[id] == null); const allOn = ids.every(id => S.selected.has(id)); ids.forEach(id => allOn ? S.selected.delete(id) : S.selected.add(id)); renderInbox(); }
  else if (a === 'expand') { const id = el.dataset.id; S.expanded.has(id) ? S.expanded.delete(id) : S.expanded.add(id); renderInbox(); }
  else if (a === 'set') {
    S.setDecision = el.dataset.v;
    const members = INBOX.filter(x => x.set === 'aoi').map(x => x.id);
    if (S.setDecision === 'merge') { const had = members.some(id => S.selected.has(id)); members.forEach(id => S.selected.delete(id)); if (had) S.selected.add('set-aoi'); }
    toast(S.setDecision === 'merge' ? '已合并：3 个包会解压到同一个游戏文件夹' : '好的，按 3 个独立的包处理');
    renderSidebar(); renderInbox();
  }
  else if (a === 'extract') { if (S.afterPref) runExtract(S.afterPref); else openModal(); }
  else if (a === 'retry') {
    const id = el.dataset.id, v = $('#pw-' + id).value;
    if (!v) { $('#pw-' + id).focus(); return; }
    INBOX.find(x => x.id === id).pw = 'saved'; delete S.failed[id]; S.selected.add(id);
    toast('密码已保存到这个包，开始解压'); runExtract(S.afterPref || 'move');
  }
  else if (a === 'clear-query') { S.query = ''; renderToolbar(); renderContent(); }
  else if (a === 'reset-filters') { S.tag = null; S.status = '全部'; S.query = ''; renderAll(); }
  else if (a === 'toast') toast(el.dataset.msg);
  else if (a === 'variant') { const vs = ['A', 'B', 'C']; setVariant(vs[(vs.indexOf(S.variant) + Number(el.dataset.d) + 3) % 3]); }
  else if (a === 'theme') {
    S.theme = { system: 'dark', dark: 'light', light: 'system' }[S.theme];
    if (S.theme === 'system') document.documentElement.removeAttribute('data-theme'); else document.documentElement.dataset.theme = S.theme;
    renderProto();
  }
});
document.addEventListener('keydown', (e) => {
  const typing = e.target.closest('input, textarea, [contenteditable]');
  if (e.key === 'Escape') { if ($('#modal').classList.contains('show')) $('#modal').classList.remove('show'); else if (S.openId != null) { S.openId = null; renderDrawer(); renderContent(); } }
  if (e.ctrlKey && e.shiftKey && (e.key === 'H' || e.key === 'h')) { e.preventDefault(); S.privacy = !S.privacy; renderToolbar(); renderContent(); }
  if (!typing && (e.key === 'ArrowLeft' || e.key === 'ArrowRight') && !e.target.closest('.row, .wall')) {
    const vs = ['A', 'B', 'C']; setVariant(vs[(vs.indexOf(S.variant) + (e.key === 'ArrowRight' ? 1 : -1) + 3) % 3]);
  }
  if (e.key === 'Enter' && e.target.matches('tr.row')) e.target.click();
});

const v = new URLSearchParams(location.search).get('variant');
if (['A', 'B', 'C'].includes(v)) S.variant = v;
renderAll();
</script>
</body>
</html>
